<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070a10">
<meta name="description" content="E RIDE - Toto and Goods ride booking">
<title>E RIDE — Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:#070a10;color:#fff;font-family:Inter,Arial,sans-serif;display:grid;place-items:center;padding:20px}.wrap{width:100%;max-width:430px}.brand{text-align:center;margin-bottom:24px}.logo{width:72px;height:72px;margin:0 auto 12px;border-radius:22px;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,#22c55e,#86efac);box-shadow:0 15px 40px #0008}.brand h1{font-size:30px;font-weight:900}.brand p{color:#8f9aaa;font-size:12px;margin-top:5px}.card{background:#10151f;border:1px solid #ffffff14;border-radius:24px;padding:22px;box-shadow:0 20px 60px #0007}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#070a10;padding:4px;border-radius:14px;margin-bottom:20px}.tabs button{border:0;background:transparent;color:#8f9aaa;padding:11px;border-radius:10px;font-weight:800;cursor:pointer}.tabs button.active{background:#22c55e;color:#041008}.field{margin-bottom:13px}.field label{display:block;font-size:11px;color:#aab3c2;margin-bottom:6px}.field input{width:100%;height:48px;border:1px solid #ffffff12;border-radius:13px;background:#151b27;color:#fff;padding:0 14px;outline:none}.field input:focus{border-color:#22c55e66}.primary,.google{width:100%;height:48px;border-radius:13px;font-weight:800;cursor:pointer}.primary{border:0;background:#22c55e;color:#041008}.google{margin-top:10px;border:1px solid #ffffff14;background:#151b27;color:#fff}.divider{display:flex;align-items:center;gap:9px;color:#6f7888;font-size:10px;margin:16px 0}.divider:before,.divider:after{content:"";height:1px;background:#ffffff12;flex:1}.forgot{text-align:right;margin:7px 0 14px}.forgot button{border:0;background:none;color:#86efac;font-size:10px;cursor:pointer}.hint{text-align:center;color:#737d8d;font-size:9px;line-height:1.6;margin-top:15px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);width:calc(100% - 30px);max-width:430px;background:#1b2432;border:1px solid #ffffff12;border-radius:13px;padding:12px 14px;font-size:11px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}.spinner{display:inline-block;width:15px;height:15px;border:2px solid #04100855;border-top-color:#041008;border-radius:50%;vertical-align:-3px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo">🛺</div><h1>E RIDE</h1><p>Toto & Goods Ride Booking</p></div>
  <div class="card">
    <div class="tabs"><button id="loginTab" class="active" onclick="showMode('login')">Sign In</button><button id="signupTab" onclick="showMode('signup')">Create Account</button></div>
    <form id="authForm">
      <div class="field" id="nameField"><label>Full Name</label><input id="name" autocomplete="name" placeholder="Your name"></div>
      <div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
      <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Minimum 6 characters" required></div>
      <div class="forgot" id="forgotBox"><button type="button" onclick="resetPassword()">Forgot password?</button></div>
      <button class="primary" id="submitBtn" type="submit">Sign In</button>
    </form>
    <div class="divider">OR</div>
    <button class="google" id="googleBtn" type="button" onclick="googleLogin()">Continue with Google</button>
    <div class="hint">By continuing, you agree to use E RIDE responsibly.<br>Customer, Driver and Admin accounts are routed automatically.</div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,updateProfile,GoogleAuthProvider,signInWithPopup,sendPasswordResetEmail,signOut} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBKuGjmLBUbPCEAQglZK7pCFxH1bnh7OF4",authDomain:"e-ride-70342.firebaseapp.com",projectId:"e-ride-70342",storageBucket:"e-ride-70342.firebasestorage.app",messagingSenderId:"946431084655",appId:"1:946431084655:web:eddcb4fffe883d4fdf659a",measurementId:"G-WZ5YPZ4YZD"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let mode='login';
const $=id=>document.getElementById(id);
window.showToast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),3000)};
window.showMode=m=>{mode=m;$('loginTab').classList.toggle('active',m==='login');$('signupTab').classList.toggle('active',m==='signup');$('nameField').classList.toggle('hidden',m==='login');$('forgotBox').classList.toggle('hidden',m!=='login');$('submitBtn').textContent=m==='login'?'Sign In':'Create Account';$('password').autocomplete=m==='login'?'current-password':'new-password'};
function routeRole(data){const role=data?.role||'customer';if(role==='admin')location.replace('admin.html');else if(role==='driver')location.replace('driver.html');else location.replace('customer.html')}
async function ensureUserDoc(user,extra={}){const ref=doc(db,'users',user.uid),snap=await getDoc(ref);if(!snap.exists()){await setDoc(ref,{uid:user.uid,name:user.displayName||extra.name||'Customer',email:user.email||'',photoURL:user.photoURL||'',role:'customer',createdAt:serverTimestamp(),updatedAt:serverTimestamp(),...extra},{merge:true})}else if(extra.name||user.photoURL){await setDoc(ref,{name:extra.name||user.displayName||snap.data().name||'Customer',photoURL:user.photoURL||snap.data().photoURL||'',updatedAt:serverTimestamp()},{merge:true})}return (await getDoc(ref)).data()}
$('authForm').addEventListener('submit',async e=>{e.preventDefault();const email=$('email').value.trim(),pass=$('password').value,name=$('name').value.trim();if(!email||!pass)return showToast('Email and password required.');if(mode==='signup'&&!name)return showToast('Name enter karo.');if(pass.length<6)return showToast('Password must be at least 6 characters.');const btn=$('submitBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';try{let cred;if(mode==='login'){cred=await signInWithEmailAndPassword(auth,email,pass)}else{cred=await createUserWithEmailAndPassword(auth,email,pass);await updateProfile(cred.user,{displayName:name});await setDoc(doc(db,'users',cred.user.uid),{uid:cred.user.uid,name,email,photoURL:'',role:'customer',createdAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true})}const data=await ensureUserDoc(cred.user,mode==='signup'?{name}:{});routeRole(data)}catch(err){console.error(err);const map={'auth/invalid-credential':'Invalid email or password.','auth/email-already-in-use':'Email already registered.','auth/invalid-email':'Invalid email address.','auth/popup-closed-by-user':'Google sign-in cancelled.','auth/too-many-requests':'Too many attempts. Try again later.'};showToast(map[err.code]||err.message||'Authentication failed.')}finally{btn.disabled=false;btn.textContent=mode==='login'?'Sign In':'Create Account'}});
window.googleLogin=async()=>{try{$('googleBtn').disabled=true;const cred=await signInWithPopup(auth,new GoogleAuthProvider());const data=await ensureUserDoc(cred.user);routeRole(data)}catch(err){console.error(err);showToast(err.code==='auth/popup-closed-by-user'?'Google sign-in cancelled.':err.message||'Google sign-in failed.')}finally{$('googleBtn').disabled=false}};
window.resetPassword=async()=>{const email=$('email').value.trim();if(!email)return showToast('Pehle email enter karo.');try{await sendPasswordResetEmail(auth,email);showToast('Password reset email sent.')}catch(err){showToast(err.message||'Could not send reset email.')}};
onAuthStateChanged(auth,async user=>{if(!user)return;try{const snap=await getDoc(doc(db,'users',user.uid));if(snap.exists())routeRole(snap.data());else{const data=await ensureUserDoc(user);routeRole(data)}}catch(e){console.error(e)}});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW:',e)))}
</script>
</body>
</html>
