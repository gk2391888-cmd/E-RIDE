<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#070a10">
<meta name="description" content="E RIDE - Toto and Goods Ride Booking">

<title>E RIDE — Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  min-height:100vh;
  background:#070a10;
  color:#fff;
  font-family:Inter,Arial,sans-serif;
  display:grid;
  place-items:center;
  padding:20px;
}

.wrap{
  width:100%;
  max-width:430px;
}

.brand{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  width:76px;
  height:76px;
  margin:0 auto 13px;
  border-radius:23px;
  display:grid;
  place-items:center;
  font-size:40px;
  background:linear-gradient(135deg,#22c55e,#86efac);
  box-shadow:0 15px 40px #0008;
}

.brand h1{
  font-size:31px;
  font-weight:900;
  letter-spacing:-1px;
}

.brand p{
  color:#8f9aaa;
  font-size:12px;
  margin-top:6px;
}

.card{
  background:#10151f;
  border:1px solid #ffffff14;
  border-radius:25px;
  padding:24px;
  box-shadow:0 20px 60px #0007;
}

.title{
  font-size:20px;
  font-weight:850;
  text-align:center;
}

.sub{
  color:#8f9aaa;
  font-size:11px;
  line-height:1.6;
  text-align:center;
  margin:8px 0 22px;
}

.google{
  width:100%;
  height:52px;
  border-radius:15px;
  border:1px solid #ffffff18;
  background:#fff;
  color:#111827;
  font-size:13px;
  font-weight:800;
  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.google:disabled{
  opacity:.6;
  cursor:wait;
}

.gicon{
  width:20px;
  height:20px;
  display:grid;
  place-items:center;
  font-size:18px;
  font-weight:900;
}

.hint{
  text-align:center;
  color:#737d8d;
  font-size:9px;
  line-height:1.7;
  margin-top:18px;
}

.status{
  margin-top:14px;
  padding:12px;
  border-radius:13px;
  background:#ffffff06;
  border:1px solid #ffffff0d;
  color:#8f9aaa;
  font-size:10px;
  text-align:center;
  display:none;
}

.status.show{
  display:block;
}

.spinner{
  display:inline-block;
  width:16px;
  height:16px;
  border:2px solid #1113;
  border-top-color:#111;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translate(-50%,20px);
  width:calc(100% - 30px);
  max-width:430px;

  background:#1b2432;
  border:1px solid #ffffff12;
  border-radius:13px;

  padding:12px 14px;
  font-size:11px;

  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">

    <div class="logo">
      🛺
    </div>

    <h1>E RIDE</h1>

    <p>
      Toto & Goods Ride Booking
    </p>

  </div>


  <div class="card">

    <div class="title">
      Welcome to E RIDE
    </div>

    <div class="sub">
      Sign up or sign in securely using your Google account.
    </div>


    <button
      class="google"
      id="googleBtn"
      type="button"
    >

      <span class="gicon">
        G
      </span>

      <span id="googleText">
        Continue with Google
      </span>

    </button>


    <div
      class="status"
      id="status"
    ></div>


    <div class="hint">

      New Google account →
      Customer account is created automatically.

      <br>

      Existing Driver/Admin roles are preserved.

    </div>

  </div>

</div>


<div
  class="toast"
  id="toast"
></div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  GoogleAuthProvider,
  signInWithPopup
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBKuGjmLBUbPCEAQglZK7PcfXh1bnh7OF4",

  authDomain:
    "e-ride-70342.firebaseapp.com",

  projectId:
    "e-ride-70342",

  storageBucket:
    "e-ride-70342.firebasestorage.app",

  messagingSenderId:
    "946431084655",

  appId:
    "1:946431084655:web:eddcb4fffe883d4fdf659a",

  measurementId:
    "G-WZ5YPZ4YZD"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


const googleProvider =
  new GoogleAuthProvider();


/* =========================
   ELEMENTS
========================= */

const googleBtn =
  document.getElementById("googleBtn");

const googleText =
  document.getElementById("googleText");

const statusBox =
  document.getElementById("status");

const toast =
  document.getElementById("toast");


let routing = false;


/* =========================
   TOAST
========================= */

function showToast(message){

  toast.textContent =
    message;

  toast.classList.add("show");

  clearTimeout(
    window.__toastTimer
  );

  window.__toastTimer =
    setTimeout(
      () =>
        toast.classList.remove("show"),
      3500
    );

}


/* =========================
   LOADING
========================= */

function setLoading(
  loading,
  message=""
){

  googleBtn.disabled =
    loading;


  googleText.innerHTML =
    loading
      ? '<span class="spinner"></span>'
      : "Continue with Google";


  if(message){

    statusBox.textContent =
      message;

    statusBox.classList.add(
      "show"
    );

  }else{

    statusBox.classList.remove(
      "show"
    );

  }

}


/* =========================
   USER DOCUMENT
========================= */

async function getOrCreateUser(
  user
){

  const userRef =
    doc(
      db,
      "users",
      user.uid
    );


  const snap =
    await getDoc(userRef);


  /*
     NEW USER
     =========
     Default role = customer
  */

  if(!snap.exists()){

    const newUser = {

      uid:
        user.uid,

      name:
        user.displayName ||
        "Customer",

      email:
        user.email ||
        "",

      photoURL:
        user.photoURL ||
        "",

      role:
        "customer",

      createdAt:
        serverTimestamp(),

      updatedAt:
        serverTimestamp()

    };


    await setDoc(
      userRef,
      newUser
    );


    return newUser;

  }


  /*
     EXISTING USER
     =============
     IMPORTANT:
     Existing driver/admin role
     will NOT be overwritten.
  */

  const existing =
    snap.data() || {};


  await setDoc(
    userRef,
    {

      uid:
        user.uid,

      name:
        user.displayName ||
        existing.name ||
        "Customer",

      email:
        user.email ||
        existing.email ||
        "",

      photoURL:
        user.photoURL ||
        existing.photoURL ||
        "",

      updatedAt:
        serverTimestamp()

    },

    {
      merge:true
    }

  );


  return {

    ...existing,

    name:
      user.displayName ||
      existing.name ||
      "Customer",

    email:
      user.email ||
      existing.email ||
      "",

    photoURL:
      user.photoURL ||
      existing.photoURL ||
      ""

  };

}


/* =========================
   ROLE REDIRECT
========================= */

function routeUser(
  userData
){

  const role =
    String(
      userData?.role ||
      "customer"
    ).toLowerCase();


  if(role === "admin"){

    window.location.replace(
      "./admin.html"
    );

    return;

  }


  if(role === "driver"){

    window.location.replace(
      "./driver.html"
    );

    return;

  }


  window.location.replace(
    "./customer.html"
  );

}


/* =========================
   GOOGLE LOGIN
========================= */

async function handleGoogleLogin(){

  if(routing)
    return;


  routing = true;


  setLoading(
    true,
    "Google account verify ho raha hai..."
  );


  try{

    const result =
      await signInWithPopup(
        auth,
        googleProvider
      );


    const userData =
      await getOrCreateUser(
        result.user
      );


    setLoading(
      true,
      "Login successful. Dashboard open ho raha hai..."
    );


    routeUser(
      userData
    );


  }catch(error){

    console.error(
      "Google login error:",
      error
    );


    routing = false;


    setLoading(
      false
    );


    const messages = {

      "auth/popup-closed-by-user":
        "Google sign-in cancel ho gaya.",

      "auth/popup-blocked":
        "Browser ne Google popup block kar diya. Popup allow karo.",

      "auth/unauthorized-domain":
        "GitHub domain Firebase Authentication me authorized nahi hai.",

      "auth/operation-not-allowed":
        "Firebase me Google Sign-In enable nahi hai.",

      "auth/network-request-failed":
        "Network problem. Internet connection check karo."

    };


    showToast(

      messages[
        error.code
      ]

      ||

      error.message

      ||

      "Google login failed."

    );

  }

}


/* =========================
   BUTTON
========================= */

googleBtn.addEventListener(
  "click",
  handleGoogleLogin
);


/* =========================
   EXISTING SESSION
========================= */

onAuthStateChanged(
  auth,

  async user => {

    if(
      !user ||
      routing
    )
      return;


    try{

      routing = true;


      setLoading(
        true,
        "Existing session mil gaya. Dashboard open ho raha hai..."
      );


      const userData =
        await getOrCreateUser(
          user
        );


      routeUser(
        userData
      );


    }catch(error){

      console.error(
        "Session restore error:",
        error
      );


      routing = false;


      setLoading(
        false
      );


      showToast(
        error.message ||
        "Account information load nahi ho saki."
      );

    }

  }

);


/* =========================
   SERVICE WORKER
========================= */

if(
  "serviceWorker"
  in navigator
){

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register(
          "./sw.js"
        )

        .catch(
          error =>
            console.warn(
              "Service Worker:",
              error
            )
        );

    }
  );

}

</script>

</body>
</html>
